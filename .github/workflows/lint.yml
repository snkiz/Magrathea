name: Lint

# Cheap checks that catch typo-level mistakes before anyone installs the thing.
# This does NOT run the test suite in tests/: those need a disposable systemd machine
# with a real "minecraft" user, which a normal CI runner is not (see tests/README.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No Windows line endings
        # A carriage return after "#!/bin/bash" makes a script fail on Linux.
        run: |
          if git grep -lI $'\r' -- . ':!*.ttf'; then
            echo "These files have CRLF line endings." >&2
            exit 1
          fi

      - name: The installer is executable
        # Git on Windows records new files as non-executable unless told otherwise.
        run: |
          for f in v2/MCSuser; do
            git ls-files -s -- "$f" | grep -q '^100755' || { echo "$f is not marked executable" >&2; exit 1; }
          done

      - name: Shell scripts parse
        run: |
          status=0
          for f in $(git ls-files); do
            case "$f" in *.ttf) continue;; esac
            if head -n1 "$f" | grep -qE '^#!.*(bash|/sh)'; then
              bash -n "$f" || { echo "syntax error in $f" >&2; status=1; }
            fi
          done
          bash -n v2/mcs/lib/MCS/MCS.lib || status=1
          exit $status

      - name: shellcheck (errors only)
        # Only real errors fail the build for now. Warnings are shown in the log, not enforced.
        run: |
          files=$(for f in $(git ls-files); do
            case "$f" in *.ttf) continue;; esac
            head -n1 "$f" | grep -qE '^#!.*(bash|/sh)' && echo "$f"
          done)
          shellcheck -s bash -S error $files v2/mcs/lib/MCS/MCS.lib
          shellcheck -s bash -S warning $files v2/mcs/lib/MCS/MCS.lib || echo "(warnings above are not enforced yet)"

      - name: Python compiles
        run: |
          python3 --version
          python3 -m py_compile $(git ls-files '*.py')

      - name: JavaScript parses
        run: node --check v2/mcs/lib/MCS/web/app.js
