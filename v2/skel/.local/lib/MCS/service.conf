##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
## Set SERVER jar, check Java Version. Check server RAM and java ARGS if any.   ##
## Customize SIGNOFF, SAVEnX and don't forget to set the TIMER.                 ##
## This is a systemd EnvironmentFile: KEY=value only. No $variables, no export. ##
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##

# Server jar file name incl. Extension.
# Eg;SERVER=fabric-server-mc.1.21-loader.0.15.11-launcher.1.0.1.jar
SERVER=NULL

# ~~Java Version~~ JAVA_HOME is the JDK folder (NOT its bin directory).
# For <1.20.5 use java 17 and comment out the java 21 entry.
# =>1.20.5 uses java 21 until further notice. Newer Minecraft versions may
# need a newer Java, so check the requirement for your version.
# This is Debian file pathing, your mileage may vary.
# JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
## RAM                                                                          ##
##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
# -Xmx = the most memory the server may use. -Xms = what it grabs at start.
# Keep them EQUAL so the JVM never has to resize the heap while players are on.
# More is NOT better: a bigger heap makes each cleanup pause longer. 4-8G is
# plenty for a small group. Leave at least 1-2G of the machine's RAM free for
# the operating system, and remember every running instance takes its own share.
RAM=-Xmx4G -Xms4G

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
## Java Arguments (ARGS)                                                        ##
##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
# Background: Java cleans up unused memory ("garbage collection", GC). While it
# does, the game can freeze for a moment, which players feel as a lag spike.
# Almost every option below is about making those cleanups short and rare.
# Pick ONE ARGS line and leave the others commented out.
#
# --- Option 1 (default): "Aikar's flags", the long-standing community standard
# for G1 garbage collection, also published in Paper's docs. Best choice for
# heaps under about 12G (RAM above).
#   -XX:+UseG1GC                   Use the G1 collector: cleans memory in small
#                                  chunks so pauses stay short.
#   -XX:+ParallelRefProcEnabled    Use several CPU cores for part of the cleanup.
#   -XX:MaxGCPauseMillis=200       Target: no cleanup pause longer than 200 ms.
#   -XX:+UnlockExperimentalVMOptions  Allows the experimental options below
#                                  (needed for G1NewSizePercent and friends).
#   -XX:+DisableExplicitGC         Ignore plugins/mods that call "clean up now".
#   -XX:+AlwaysPreTouch            Claim all the RAM at start, so the server
#                                  isn't slowed down by grabbing it mid-game.
#   -XX:G1NewSizePercent=30 and G1MaxNewSizePercent=40
#                                  Reserve 30-40% of the heap for brand-new
#                                  objects. Minecraft makes huge amounts of
#                                  short-lived objects, so they get a big nursery.
#   -XX:G1HeapRegionSize=8M        Size of the chunks G1 works in.
#   -XX:G1ReservePercent=20        Keep 20% free as headroom for surprises.
#   -XX:G1HeapWastePercent=5       Don't bother cleaning when only 5% is garbage.
#   -XX:G1MixedGCCountTarget=4     Spread old-memory cleanup over 4 small steps.
#   -XX:InitiatingHeapOccupancyPercent=15
#                                  Start background cleanup early (at 15% full),
#                                  so it never has to panic.
#   -XX:G1MixedGCLiveThresholdPercent=90
#                                  Skip chunks that are still 90% in use.
#   -XX:G1RSetUpdatingPauseTimePercent=5
#                                  Spend at most 5% of a pause on bookkeeping.
#   -XX:SurvivorRatio=32 and -XX:MaxTenuringThreshold=1
#                                  Objects that survive one cleanup are promoted
#                                  to long-term memory at once (most Minecraft
#                                  objects either die quickly or live for good).
#   -XX:+PerfDisableSharedMem      Stops the JVM writing a stats file to /tmp
#                                  on every GC, which can cause stalls.
#   -Dusing.aikars.flags / -Daikars.new.flags
#                                  Just labels. Paper reads them to know these
#                                  flags are in use. No effect on performance.
#   -XX:+IgnoreUnrecognizedVMOptions
#                                  Safety net: if a future Java removes a flag,
#                                  skip it instead of refusing to start. Remove
#                                  it if you want typos to be reported.
ARGS=-XX:+IgnoreUnrecognizedVMOptions -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true
#
# --- Option 2: heap of 12G or more. Same as Option 1 but with these changes:
#   G1NewSizePercent=40, G1MaxNewSizePercent=50, G1HeapRegionSize=16M,
#   G1ReservePercent=15, InitiatingHeapOccupancyPercent=20.
#   (A bigger heap needs a bigger nursery and bigger chunks.)
#
# --- Option 3: ZGC, for large heaps and the lowest pauses. Needs Java 21 or
# newer. On Java 21 the "generational" flag is REQUIRED (without it you get the
# older ZGC, which is worse for Minecraft). Newer Java versions make it the default.
#   -XX:+UseZGC                    Collector that does nearly all its work while
#                                  the game keeps running (pauses well under 10 ms).
#   -XX:+ZGenerational             Treat new and old objects separately (Java 21).
#   Costs more CPU and memory than G1, and is less proven for Minecraft.
#   Worth testing if you give the server 12G+ and see GC spikes.
# ARGS=-XX:+UseZGC -XX:+ZGenerational -XX:+AlwaysPreTouch -XX:+DisableExplicitGC
#
# --- The ARGS this tool shipped before (the "Minecraft Performance Guide" set).
# Removed on purpose: it was a pile of low-level micro-tuning (code cache sizes,
# compiler limits, thread priority tweaks) with little proof it helps, and a
# couple of options need root or are retired in newer Java, which printed
# warnings or could stop the server from starting.

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
## Shutdown message                                                             ##
##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
# @TIMER@ is replaced by the TIMER value (seconds).
TIMER=10
SIGNOFF=SERVER SHUTTING DOWN IN @TIMER@ SECONDS. SAVING ALL MAPS...
SAVEnX=SERVER SHUTTING DOWN NOW, GOODBYE!
