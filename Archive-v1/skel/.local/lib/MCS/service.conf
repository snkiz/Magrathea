[Service]
##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##
## Set SERVER jar, ckeck Java Version. Check server RAM and java ARGS if any.   ##
## Customize SIGNOFF, SAVEnX and don't forget to set the TIMER.                 ##  
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ ##

# Server jar file name incl. Extension.
# Eg;SERVER=fabric-server-mc.1.21-loader.0.15.11-launcher.1.0.1.jar
 SERVER=NULL
 
# ~~Java Version~~ USE ONLY ONE!! 
# For <1.20.5 Uncomemt the java 17 entry and coment out the java 21 entry.
# =>1.20.5 uses java 21 until further notice. 
# This is Debian file pathing, your milage may vary
# JAVA_HOME=/PATH/TO/JAVA/OF/YOUR/CHOICE 
# JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64/bin pdfsam
 JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64/bin pdfsam

# Xmx/Xms Should be equal, except in low ram/multi-instance senarios.
 RAM=-Xmx4G -Xms4G

# Java Arguments. If you don't know what this this, DON'T TOUCH IT.
# These are a basic set that should work in most cercumcatnces. More informaion here;
# https://github.com/DataDalton/Minecraft-Performance-Guide/tree/main/Java%20Arguments
 ARGS=-XX:+UnlockExperimentalVMOptions -XX:+UnlockDiagnosticVMOptions -XX:+AlwaysActAsServerClassMachine -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+UseNUMA -XX:NmethodSweepActivity=1 -XX:ReservedCodeCacheSize=400M -XX:NonNMethodCodeHeapSize=12M -XX:ProfiledCodeHeapSize=194M -XX:NonProfiledCodeHeapSize=194M -XX:-DontCompileHugeMethods -XX:MaxNodeLimit=240000 -XX:NodeLimitFudgeFactor=8000 -XX:+UseVectorCmov -XX:+PerfDisableSharedMem -XX:+UseFastUnorderedTimeStamps -XX:+UseCriticalJavaThreadPriority -XX:ThreadPriorityPolicy=1 -XX:AllocatePrefetchStyle=3 \
-XX:+UseG1GC -XX:MaxGCPauseMillis=130 -XX:G1NewSizePercent=28 -XX:G1HeapRegionSize=16M -XX:G1ReservePercent=20 -XX:G1MixedGCCountTarget=3 -XX:InitiatingHeapOccupancyPercent=10 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=0 -XX:SurvivorRatio=32 -XX:MaxTenuringThreshold=1 -XX:G1SATBBufferEnqueueingThresholdPercent=30 -XX:G1ConcMarkStepDurationMillis=5

# ShutDown Message
 TIMER=10
 SIGNOFF=SERVER SHUTTING DOWN IN $TIMER SECONDS. SAVING ALL MAPS...
 SAVEnX=SERVER SHUTTING DOWN NOW, GOODBYE!
 
